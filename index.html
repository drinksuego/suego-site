<!doctype html>
<html lang="en">
<head>
<!--
  suego · landing page v4
  the product does not need to explain itself.
  rules: lowercase. few words. no sale language. no icons, badges, gradients, exclamation marks.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>suego — salt. lime. sparkling water.</title>
<meta name="description" content="suego. salt, lime, sparkling water. a sparkling suero, made in california.">
<meta name="theme-color" content="#FAF8F4">
<meta property="og:type" content="website">
<meta property="og:title" content="suego">
<meta property="og:description" content="salt. lime. sparkling water.">
<meta property="og:image" content="https://drinksuego.com/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Newsreader:opsz,wght@6..72,300&display=swap">
<link rel="preload" as="image" href="assets/hero-2000.webp" imagesrcset="assets/hero-1200.webp 1200w, assets/hero-2000.webp 2000w" imagesizes="100vw">
<style>
  :root {
    color-scheme: light;
    --paper: #FAF8F4;
    --ink: #1C1C1A;
    --ink-2: #6E6B63;
    --rule: rgba(28, 28, 26, 0.12);
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --sans: "Montserrat", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --gut: clamp(20px, 4vw, 56px);
    --air: clamp(120px, 16vw, 240px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 500 11px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  h1, h2, p, figure { margin: 0; }
  h1, h2 { font-family: var(--serif); font-weight: 300; letter-spacing: -0.02em; text-wrap: balance; }
  :focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }

  .label { font: 500 11px/1.5 var(--sans); letter-spacing: 0.16em; color: var(--ink-2); }

  /* header sits on the sky of the hero photo */
  .site-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: center;
    padding: 28px var(--gut);
  }
  .wordmark { font: 600 24px/1 var(--sans); letter-spacing: -0.045em; }

  .hero {
    height: clamp(560px, 100svh, 1100px);
    background: #E9E6DF;
    overflow: hidden;
  }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }

  .statement { padding: var(--air) var(--gut); text-align: center; }
  .statement h1 { font-size: clamp(42px, 6.4vw, 104px); line-height: 1; margin: 28px auto; }

  .site-footer {
    border-top: 1px solid var(--rule);
    padding: 32px var(--gut);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px 24px;
  }
  .site-footer a:hover { color: var(--ink); }

  @media (max-width: 699px) {
    .hero { height: min(100svh, 880px); }
    .hero img { object-position: 76% 50%; }
    .site-footer { justify-content: center; text-align: center; flex-direction: column; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="/" aria-label="suego">suego</a>
</header>

<main>
  <figure class="hero">
    <img
      src="assets/hero-2000.webp"
      srcset="assets/hero-1200.webp 1200w, assets/hero-2000.webp 2000w"
      sizes="100vw"
      width="2000" height="1493"
      alt="a bottle of suego on a weathered wooden table above the ocean, late afternoon light"
      fetchpriority="high">
  </figure>

  <section class="statement" aria-labelledby="statement">
    <p class="label">no. 01 · lime</p>
    <h1 id="statement">salt. lime. sparkling water.</h1>
    <p class="label">a sparkling suero · made in california</p>
  </section>
</main>

<footer class="site-footer label">
  <span>© 2026 suego · be the salt.</span>
  <a href="mailto:hello@drinksuego.com">hello@drinksuego.com</a>
</footer>

</body>
</html>
